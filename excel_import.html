<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCS — Импорт Excel</title>
<style>
:root{--bg:#0C0B09;--bg2:#141210;--bg3:#1C1A16;--border:#2A2620;--border2:#363028;--text:#F0EBE0;--text2:#9A9080;--text3:#5A5448;--accent:#185FA5;--green:#0F6E56;--radius:10px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:560px}
h2{font-size:18px;font-weight:600;margin-bottom:6px}
.sub{font-size:13px;color:var(--text3);margin-bottom:24px;line-height:1.6}
.upload-area{border:2px dashed var(--border2);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all 0.15s;margin-bottom:16px}
.upload-area:hover{border-color:var(--accent);background:#0C1A2E}
.upload-icon{font-size:36px;margin-bottom:10px}
.upload-text{font-size:13px;color:var(--text3)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;display:none}
.stat{background:var(--bg3);border-radius:8px;padding:10px;text-align:center}
.stat-val{font-size:20px;font-weight:600;color:var(--accent)}
.stat-label{font-size:10px;color:var(--text3);margin-top:2px}
.progress-wrap{display:none;margin-bottom:16px}
.progress{background:var(--bg3);border-radius:999px;height:10px;overflow:hidden;margin-bottom:8px}
.progress-bar{background:var(--accent);height:100%;width:0%;transition:width 0.3s;border-radius:999px}
.progress-text{font-size:12px;color:var(--text2)}
.log{background:#0C0B09;border-radius:8px;padding:12px;font-size:11px;font-family:monospace;max-height:200px;overflow-y:auto;margin-bottom:16px;display:none}
.btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.btn:disabled{background:var(--border2);color:var(--text3);cursor:not-allowed}
.btn-back{background:var(--bg3);color:var(--text2);border:0.5px solid var(--border2);margin-top:8px}
.success{text-align:center;padding:20px 0;display:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h2>📊 Импорт Excel в журнал</h2>
  <div class="sub">Загрузите ваш Excel файл — все заявки автоматически распределятся по месяцам в Supabase</div>

  <div id="main-area">
    <div class="upload-area" onclick="document.getElementById('f').click()" id="upload-area">
      <div class="upload-icon">📂</div>
      <div class="upload-text">Нажмите чтобы выбрать Excel файл (.xlsx)<br><span style="font-size:11px;color:var(--text3)">или перетащите сюда</span></div>
    </div>
    <input type="file" id="f" accept=".xlsx,.xls" style="display:none" onchange="loadFile(this)">

    <div class="stats" id="stats">
      <div class="stat"><div class="stat-val" id="s-rows">0</div><div class="stat-label">Строк</div></div>
      <div class="stat"><div class="stat-val" id="s-months">0</div><div class="stat-label">Месяцев</div></div>
      <div class="stat"><div class="stat-val" id="s-skip">0</div><div class="stat-label">Пропустим</div></div>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="progress-text" id="progress-text">Подготовка...</div>
    </div>

    <div class="log" id="log"></div>

    <button class="btn" id="btn-import" onclick="startImport()" disabled>🚀 Загрузить в базу данных</button>
    <button class="btn btn-back" onclick="window.location.href='app.html'">← Вернуться в журнал</button>
  </div>

  <div class="success" id="success">
    <div style="font-size:48px;margin-bottom:12px">✅</div>
    <div style="font-size:18px;font-weight:600;color:#2ECC71;margin-bottom:8px">Импорт завершён!</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:20px" id="success-msg"></div>
    <button class="btn" onclick="window.location.href='app.html'">→ Открыть журнал</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SB_URL='https://krjhnwjiorpzgqpojgjt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtyamhud2ppb3JwemdxcG9qZ2p0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTY5NzAsImV4cCI6MjA5Mjg5Mjk3MH0.fgmrOZKVDTb8TOGHTnGXoDArCfB9IUm6rCEryNFTIUs';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let rows=[];
let currentUserId=null;

// Check auth
sb.auth.getSession().then(({data:{session}})=>{
  if(!session){window.location.href='index.html';return;}
  currentUserId=session.user.id;
});

// Drag and drop
const area=document.getElementById('upload-area');
area.addEventListener('dragover',e=>{e.preventDefault();area.style.borderColor='var(--accent)';});
area.addEventListener('dragleave',()=>{area.style.borderColor='';});
area.addEventListener('drop',e=>{e.preventDefault();area.style.borderColor='';const f=e.dataTransfer.files[0];if(f)processFile(f);});

function loadFile(input){
  const f=input.files[0];if(!f)return;
  processFile(f);
}

function processFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{defval:null,raw:false,dateNF:'yyyy-mm-dd'});
      rows=data.map(mapRow).filter(r=>r!==null);
      const months=[...new Set(rows.map(r=>r.date?r.date.substring(0,7):null).filter(Boolean))];
      const skipped=data.length-rows.length;
      document.getElementById('s-rows').textContent=rows.length;
      document.getElementById('s-months').textContent=months.length;
      document.getElementById('s-skip').textContent=skipped;
      document.getElementById('stats').style.display='grid';
      document.getElementById('btn-import').disabled=false;
      document.getElementById('upload-area').innerHTML=`<div style="font-size:24px;margin-bottom:8px">✅</div><div style="font-size:13px;color:#2ECC71">Файл загружен: <b>${file.name}</b></div><div style="font-size:11px;color:var(--text3);margin-top:4px">${rows.length} строк готовы к импорту</div>`;
      log(`Файл прочитан: ${data.length} строк, ${rows.length} валидных, ${months.length} месяцев`,'#2ECC71');
    }catch(err){
      log('Ошибка чтения файла: '+err.message,'#F87171');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Маппинг строки Excel → поля Supabase
function mapRow(r){
  // Колонки вашего файла:
  // дата оплаты FCS | наименование | сумма оплаты FCS | тип оплаты FCS | Контрагент |
  // дата оплаты контрагенту | сумма оплаты контрагенту | Валюта | тип оплаты контрагенту |
  // комиссия FCS | статус оплаты | комментарий | ссылка | Направление | Исполнитель | Проверяющий | Воронка

  const dateRaw = r['дата оплаты FCS'];
  if(!dateRaw) return null;

  // Парсим дату
  let date = null;
  if(typeof dateRaw === 'string'){
    // Пробуем разные форматы
    const d = new Date(dateRaw);
    if(!isNaN(d)) date = d.toISOString().split('T')[0];
  } else if(dateRaw instanceof Date){
    date = dateRaw.toISOString().split('T')[0];
  }
  if(!date) return null;

  // Маппинг типа оплаты FCS
  const payMap = {
    'перевод на карту':'personal',
    'по ссылке':'link',
    'по счету':'invoice',
    'по счёту':'invoice',
    'по qr':'qr',
    'корп карта':'corporate',
    'иностранная карта':'foreign',
  };
  const payRaw=(r['тип оплаты FCS']||'').toLowerCase().trim();
  const pay=payMap[payRaw]||'personal';

  // Маппинг направления
  const deptMap={
    'travel':'travel',
    'logistics':'logistic',
    'logistic':'logistic',
    'lifestyle':'lifestyle',
    'кбр':'kbr',
    'kbr':'kbr',
    'vip':'vip',
    'внутренний':'internal',
    'бизнес-задачи':'internal',
    'internal':'internal',
  };
  const deptRaw=(r['Направление']||'').toLowerCase().trim();
  const dept=deptMap[deptRaw]||'logistic';

  // Маппинг типа оплаты контрагенту
  const agentPayMap={
    'переводом':'card_rf',
    'карта рф':'card_rf',
    'иностранная карта':'foreign_card',
    'иностр. карта':'foreign_card',
    'ссылка напрямую от партнера':'link_partner',
    'ссылка напрямую от партнёра':'link_partner',
    'корп карта':'corp_card',
    'счет':'invoice',
    'счёт':'invoice',
    'анастасия байер':'buyer',
    'наличные':'cash',
  };
  const agentPayRaw=(r['тип оплаты контрагенту']||'').toLowerCase().trim();
  const agentPayType=agentPayMap[agentPayRaw]||null;

  // Валюта
  const currencyRaw=(r['Валюта']||'RUB').toUpperCase();
  const currency=currencyRaw.includes('РУБ')||currencyRaw.includes('RUB')?'RUB':
    currencyRaw.includes('USD')||currencyRaw.includes('ДОЛ')?'USD':
    currencyRaw.includes('EUR')||currencyRaw.includes('ЕВР')?'EUR':
    currencyRaw.includes('JPY')||currencyRaw.includes('ЙЕН')?'JPY':
    currencyRaw.includes('AED')?'AED':
    currencyRaw.includes('TRY')||currencyRaw.includes('ЛИР')?'TRY':
    currencyRaw.includes('KZT')?'KZT':
    currencyRaw.split(' ')[0]||'RUB';

  // Статус
  const statusRaw=(r['статус оплаты']||'').toString().toLowerCase();
  const status=statusRaw.includes('оплач')||statusRaw.includes('paid')?'paid':
    statusRaw.includes('отмен')||statusRaw.includes('cancel')?'cancelled':
    statusRaw.includes('частич')||statusRaw.includes('partial')?'partial':'pending';

  // Ссылка AmoCRM
  const link=r['ссылка']||null;

  return {
    date,
    dept,
    service:(r['наименование']||'—').toString().trim(),
    agent:(r['Контрагент']||null),
    amount:parseFloat(r['сумма оплаты FCS'])||0,
    currency:'RUB',
    pay,
    agent_amount:parseFloat(r['сумма оплаты контрагенту'])||0,
    agent_currency:currency,
    agent_pay_type:agentPayType,
    commission:parseFloat(r['комиссия FCS'])||0,
    status,
    link:link?link.toString().trim():null,
    note:(r['комментарий']||null),
    is_loss:false,
    is_expense:false,
    submitted_by:currentUserId,
    from_form:false,
  };
}

function log(msg,color='#9A9080'){
  const el=document.getElementById('log');
  el.style.display='block';
  el.innerHTML+=`<div style="color:${color};margin-bottom:2px">${msg}</div>`;
  el.scrollTop=el.scrollHeight;
}

async function startImport(){
  if(!rows.length)return;
  document.getElementById('btn-import').disabled=true;
  document.getElementById('progress-wrap').style.display='block';

  let imported=0,errors=0;
  const BATCH=25;
  const total=rows.length;

  for(let i=0;i<total;i+=BATCH){
    const batch=rows.slice(i,i+BATCH);
    const {error}=await sb.from('entries').insert(batch);
    if(error){
      errors+=batch.length;
      log(`❌ Пакет ${Math.floor(i/BATCH)+1}: ${error.message}`,'#F87171');
    } else {
      imported+=batch.length;
    }
    const pct=Math.round((i+BATCH)/total*100);
    document.getElementById('progress-bar').style.width=Math.min(pct,100)+'%';
    document.getElementById('progress-text').textContent=`Загружено ${imported} из ${total}...`;
    log(`✓ ${imported}/${total} записей загружено`,'#4A9A6A');
    await new Promise(r=>setTimeout(r,50));
  }

  document.getElementById('progress-bar').style.width='100%';

  if(errors===0){
    document.getElementById('success-msg').innerHTML=
      `Успешно загружено <b>${imported} записей</b><br>Данные распределены по месяцам автоматически`;
    document.getElementById('main-area').style.display='none';
    document.getElementById('success').style.display='block';
  } else {
    log(`Завершено: ${imported} загружено, ${errors} ошибок`,'#F59E0B');
    document.getElementById('btn-import').disabled=false;
  }
}
</script>
</body>
</html>
